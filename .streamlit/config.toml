[server]
address = "0.0.0.0"
port = 8501
# Streamlit Cloud runs without an interactive browser or terminal prompt.
# Keep the server headless so startup never waits for a local UI.
headless = true
showEmailPrompt = false

[theme]
base = "light"
primaryColor = "#635BFF"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#17181C"
font = "sans serif"
